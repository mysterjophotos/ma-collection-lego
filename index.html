<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma collection LEGO</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b2a5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes LEGO">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="icon" href="icons/icon-192.png">
<script src="standalone.js"></script>
<script src="xlsx.full.min.js"></script>
<script src="calc.js"></script>
<style>
/* Univers : fond bleu brique, cartes blanches épaisses (effet brique), jaune / rouge / vert en accents.
   Mise en page : toujours un écran de téléphone, sans défilement : les listes sont découpées en pages
   (flèches, glissement du doigt, molette) et les rubriques en sous-onglets. Sur PC, le même écran est centré. */
:root{
  --blue:#0a5cb8; --blue-deep:#06428a; --blue-ink:#0b3a78; --sky:#36b4f0; --sky-2:#1e8fe0;
  --yellow:#ffd200; --yellow-deep:#e8a800; --red:#e3000b; --red-deep:#a8000a; --green:#00a651; --green-deep:#007a3b; --orange:#ff8a00;
  --card:#ffffff; --card-2:#f1f5fb; --ink:#0f2747; --muted:#435570; --line:#dde5f0;
  --good:#008f45; --good-bg:#dff5e8; --bad:#d4000b; --bad-bg:#ffe5e5; --warn:#a86b00; --warn-bg:#fff3c4;
  --s-achat:#9aa9bf; --s-valeur:#0a5cb8; --s-budget:#b8860b;
  --display:"Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
  --body:"Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
  --r:16px; --edge:0 4px 0 rgba(6,40,90,.18);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--body);font-size:16px;line-height:1.4;color:var(--ink);display:flex;justify-content:center;
  background:#062f66 radial-gradient(circle at 50% 50%, rgba(255,255,255,.05) 0 11px, transparent 12px) 0 0/44px 44px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:700;letter-spacing:0}
h1{font-size:1.45rem;line-height:1.1} h2{font-size:1.15rem;color:var(--blue-ink)} h3{font-size:1rem;color:var(--blue-ink)}

/* Cadre de téléphone */
#app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:var(--blue) radial-gradient(circle at 50% 50%, rgba(255,255,255,.07) 0 11px, transparent 12px) 0 0/44px 44px}
@media (min-width:600px) and (min-height:640px){
  body{align-items:center}
  #app{height:min(calc(100dvh - 40px), 900px);border-radius:30px;box-shadow:0 0 0 10px #0b2147, 0 24px 60px rgba(0,0,0,.45)}
}

/* En-tête */
header.top{flex:none;z-index:20;background:var(--blue-deep);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;box-shadow:0 3px 0 rgba(0,0,0,.12);display:flex;align-items:center;gap:10px;min-height:52px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.2rem;color:#fff;text-decoration:none;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{color:#fff;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:0;background:none;cursor:pointer;text-decoration:none;font-size:1.1rem;flex:none}
.hbtn:hover{background:rgba(255,255,255,.12)}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.8rem;color:#cfe2ff;font-weight:700}
.sync #synctxt{display:none}
.dot{width:10px;height:10px;border-radius:50%;background:#8aa6c9;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.dot.ok{background:#3ee07f} .dot.busy{background:var(--yellow);animation:pulse 1s infinite} .dot.err{background:#ff5a5f}
@keyframes pulse{50%{opacity:.35}}

/* Barre d'onglets du bas */
nav.tabs{flex:none;z-index:30;display:flex;justify-content:space-around;align-items:flex-end;background:#fff;border-radius:16px 16px 0 0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 0 rgba(6,40,90,.12)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem;letter-spacing:-.01em;font-weight:800;padding:5px 2px;color:var(--muted);text-decoration:none;flex:1;min-width:0;border-radius:12px}
nav.tabs a svg{width:21px;height:21px}
nav.tabs a.on{color:var(--blue)}
nav.tabs a.add{flex:none;width:52px;height:52px;border-radius:50%;justify-content:center;margin:-26px 2px 0;border:4px solid #fff;background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-deep);font-size:0;gap:0}
nav.tabs a.add svg{width:28px;height:28px}

/* Zone centrale : remplit l'écran, ne défile pas */
main{flex:1;min-height:0;overflow:hidden;padding:10px 12px;display:flex;flex-direction:column;gap:10px;position:relative}
main > *{flex:none;min-width:0}
.fill{flex:1 1 auto !important;min-height:0;overflow:hidden}
.scrollsafe{overflow:auto;scrollbar-width:thin}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.card{background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--edge)}
.card.col{display:flex}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nowrap{flex-wrap:nowrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.8rem}
.b{font-weight:800}
.on-blue{color:#fff} .on-blue h1,.on-blue h2{color:#fff}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hidden{display:none !important}
.empty{padding:20px 10px;text-align:center;color:var(--muted);font-weight:700}
.on-blue .empty,.empty.on-blue{color:#cfe2ff}

/* Liens internes */
a.lnk{color:inherit;text-decoration:underline;text-decoration-color:rgba(10,92,184,.35);text-underline-offset:2px;font-weight:800}
a.lnk:hover{text-decoration-color:currentColor}
a.chip{text-decoration:none}
a.chip:hover{filter:brightness(.95)}

/* Sous-onglets (pastilles) */
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -2px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs a{flex:none;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-family:var(--display);font-weight:600;font-size:.98rem;text-decoration:none;white-space:nowrap}
.subtabs a.on{background:var(--yellow);color:var(--blue-ink);box-shadow:0 3px 0 var(--yellow-deep)}

/* Recherche */
.searchbox{position:relative}
.searchbox input[type=search]{height:50px;width:100%;font-family:var(--display);font-size:1.1rem;font-weight:600;padding:10px 14px 10px 46px;border-radius:14px;border:0;background:#fff;color:var(--blue-ink);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.searchbox input::placeholder{color:#8ea3c0}
.searchbox > svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--blue)}

/* Lignes (hauteur fixe pour paginer sans défiler) */
.list{display:flex;flex-direction:column}
.set{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;height:76px;padding:0 6px 0 4px;border-bottom:2px solid var(--card-2);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%;color:inherit}
.set:last-child{border-bottom:0}
.set:hover{background:#f7faff}
.set .thumb{width:52px;height:52px;border-radius:12px;padding:2px}
.set .t{font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--blue-ink);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .ref{font-family:var(--display);font-weight:700;color:var(--sky-2);font-size:.86rem;margin-right:5px}
.set .meta{display:flex;gap:5px;flex-wrap:nowrap;overflow:hidden;align-items:center;font-size:.84rem;color:var(--muted);margin-top:3px;font-weight:700;white-space:nowrap}
.set .r{text-align:right;display:grid;gap:1px;justify-items:end;font-size:.86rem}
.set .r .v{font-family:var(--display);font-weight:700;font-size:.98rem;color:var(--blue-ink)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;height:48px;padding:0 6px;border-bottom:2px solid var(--card-2);text-decoration:none;color:inherit;cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:#f7faff}
.lrow .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .sub{font-size:.82rem;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .rt{text-align:right;font-size:.82rem;font-weight:800;white-space:nowrap}
.thumb{width:72px;height:72px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;border:2px solid var(--line);padding:3px}
.thumb img{display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;background:#fff;border-radius:10px}
.thumb.lg{width:96px;height:96px}
.thumb.xl{width:100%;height:100%;border-radius:16px;border:0;padding:6px}
.thumb .ph{width:60%;height:60%}

/* Pagination */
.scroll{overflow-y:auto !important;overscroll-behavior:contain;scrollbar-width:thin;margin-right:-6px;padding-right:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:2px 2px 6px}
.sq{aspect-ratio:1/1;border-radius:18px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 #d9e3f1;position:relative;display:flex;align-items:center;justify-content:center;padding:8px 8px 28px;cursor:pointer;overflow:hidden;min-width:0;color:inherit;text-decoration:none}
.sq:hover{border-color:var(--sky)}
.sq .thumb{width:100%;height:100%;border:0;padding:0;border-radius:10px}
.sq .rf{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.12rem;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.sq .qb{position:absolute;bottom:6px;right:6px;background:var(--blue);color:#fff;border-radius:999px;font-size:.78rem;font-weight:800;padding:1px 6px}
.sq .st{position:absolute;top:8px;left:8px;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.sq .st.ret{background:#2b2b2b;box-shadow:0 0 0 2px var(--yellow)} .sq .st.ven{background:var(--sky)}
.sq .gn{position:absolute;top:6px;right:6px;font-size:.84rem;font-weight:800;background:rgba(255,255,255,.92);border-radius:6px;padding:0 4px}
.sq.sto{padding:10px;flex-direction:column;justify-content:space-between;align-items:stretch;text-align:left}
.sq.sto .big{font-size:2.2rem;line-height:1;width:56px;height:56px;display:grid;place-items:center}
.stoimg{width:100%;height:100%;object-fit:contain;border-radius:8px;display:block}
.ico .stoimg{padding:3px}
.sq.info .em .stoimg{width:64px;height:64px}
.sq.sto .nm{font-family:var(--display);font-weight:700;font-size:1.12rem;color:var(--blue-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq.sto .lo{font-size:.82rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq.sto .ct{position:absolute;top:10px;right:10px;text-align:right;font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--blue-ink);line-height:1}
.sq.sto .ct small{display:block;font-family:var(--body);font-size:.78rem;color:var(--muted);font-weight:800}
.sq.inv{transition:transform .08s}
.sq.inv:active{transform:scale(.96)}
.sq.inv .ck{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:3px solid var(--line);background:#fff;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1rem}
.sq.inv.on{border-color:var(--green,#1f9d55);box-shadow:0 3px 0 #a7d7b8}
.sq.inv.on .ck{background:var(--green,#1f9d55);border-color:var(--green,#1f9d55)}
.sq.inv.off .thumb{opacity:.45;filter:grayscale(.6)}
.sq.inv.add{border-color:var(--yellow);box-shadow:0 3px 0 #e8c64a}
.sq.inv.add .ck{background:var(--yellow);border-color:var(--yellow);color:var(--blue-ink)}
.sq .lockb{position:absolute;top:8px;left:72px;font-size:1.05rem}
.invbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.invbar .prog{flex:1;min-width:120px;height:12px;border-radius:99px;background:var(--card-2);overflow:hidden}
.invbar .prog i{display:block;height:100%;background:var(--green,#1f9d55)}
.invres{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.invres .set{grid-template-columns:48px 1fr auto}
.sq.sto .pics{display:flex;gap:4px;height:38%;margin:2px 0}
.sq.sto .pics .thumb{flex:1;height:100%;width:auto;border:0;padding:0;background:var(--card-2);border-radius:8px}
.sq.info{padding:10px 12px;flex-direction:column;justify-content:space-between;align-items:stretch;text-align:left;gap:4px}
.sq.info .lb{font-size:.84rem;font-weight:800;color:var(--muted);line-height:1.15}
.sq.info .bg{font-family:var(--display);font-weight:700;font-size:1.45rem;color:var(--blue-ink);line-height:1.1;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.sq.info .bg.sm{font-size:1.15rem}
.sq.info .nm2{font-family:var(--display);font-weight:600;font-size:1.08rem;color:var(--blue-ink);line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sq.info .sb{font-size:.82rem;font-weight:700;color:var(--muted);line-height:1.25}
.sq.info .ph2{flex:1;min-height:0;display:flex}
.sq.info .ph2 .thumb{width:100%;height:100%;border:0;padding:0}
.sq.info .em{font-size:2.4rem;line-height:1}
.sq.cur{border-color:var(--yellow);box-shadow:0 3px 0 var(--yellow-deep)}
.sq .acts{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.sq .acts .btn{padding:4px 9px}
.sq .own{position:absolute;top:6px;left:6px}
.layout{display:inline-flex;background:#fff;border-radius:12px;padding:3px;gap:2px;box-shadow:0 3px 0 rgba(0,0,0,.15);flex:none}
.layout button{border:0;background:none;width:34px;height:34px;border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.layout button.on{background:var(--yellow);color:var(--blue-ink)}
.layout svg{width:20px;height:20px}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;height:40px;flex:none}
.pager button{width:44px;height:36px;border-radius:12px;border:0;background:#fff;color:var(--blue-ink);font-family:var(--display);font-size:1.3rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #c9d6e8, inset 0 0 0 2px var(--line)}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{font-family:var(--display);font-weight:600;min-width:70px;text-align:center;color:var(--blue-ink)}
.on-blue .pager span,.pager.light span{color:#fff}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:800;background:var(--card-2);color:var(--muted);white-space:nowrap;flex:none}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.blue{background:#e1efff;color:var(--blue)} .chip.yellow{background:var(--yellow);color:var(--blue-ink)}
.chip.retired{background:#2b2b2b;color:var(--yellow)}
.chip.x{padding-right:4px} .chip.x b{margin-left:2px;width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;background:rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.chips::-webkit-scrollbar{display:none}
.up{color:var(--good)} .down{color:var(--bad)}

/* Boutons briques */
.btn{border:0;background:#fff;border-radius:12px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--blue-ink);box-shadow:0 4px 0 #c9d6e8, inset 0 0 0 2px var(--line);transition:transform .06s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c9d6e8, inset 0 0 0 2px var(--line)}
.btn.primary{background:var(--sky);color:#fff;box-shadow:0 4px 0 var(--sky-2)}
.btn.yellow{background:var(--yellow);color:var(--blue-ink);box-shadow:0 4px 0 var(--yellow-deep)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-deep)}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-deep)}
.btn.danger{color:var(--bad);box-shadow:0 4px 0 #f0b7b7, inset 0 0 0 2px #f5c6c6}
.btn.danger.armed{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-deep)}
.btn.sm{padding:6px 11px;font-size:.92rem;border-radius:10px}
.btn.big{padding:12px 18px;font-size:1.1rem;border-radius:14px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:.72rem;font-weight:800;padding:0 5px}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* Tuiles chiffres */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile{border-radius:var(--r);padding:10px 12px;color:#fff;display:grid;gap:1px;box-shadow:0 4px 0 rgba(0,0,0,.2);position:relative;overflow:hidden;text-decoration:none;min-width:0}
.tile::after{content:"";position:absolute;right:-8px;top:-8px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16)}
a.tile:active{transform:translateY(2px)}
.tile .lab{font-size:.84rem;font-weight:800;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{font-family:var(--display);font-size:1.55rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tiles.t3 .tile .val{font-size:1.25rem}
.tile .sub{font-size:.8rem;font-weight:700;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-red{background:var(--red)} .t-yellow{background:var(--yellow);color:var(--blue-ink)} .t-green{background:var(--green)} .t-sky{background:var(--sky-2)} .t-orange{background:var(--orange)} .t-white{background:#fff;color:var(--blue-ink)} .t-ink{background:var(--blue-ink)}

/* Podium des thèmes */
.podium{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;gap:5px;padding-top:30px}
.pod{display:grid;justify-items:center;gap:4px;text-align:center;text-decoration:none;min-width:0}
.pod .bar{width:100%;border-radius:12px 12px 4px 4px;background:linear-gradient(#57c6ff,rgba(54,180,240,.15));display:grid;justify-items:center;align-content:start;padding:30px 2px 6px;position:relative;color:#fff}
.pod .bar .thumb{position:absolute;top:-26px;width:52px;height:52px;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.pod .nm{font-weight:800;font-size:.68rem;line-height:1.1;opacity:.95;overflow:hidden;max-width:100%}
.pod .vv{font-family:var(--display);font-weight:700;font-size:.95rem}
.pod .rk{font-family:var(--display);font-weight:700;color:var(--yellow);font-size:.9rem}
.pod.first .bar{background:linear-gradient(var(--yellow),#f2b600);color:var(--blue-ink)}

/* Formulaires */
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:7px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;min-height:42px;font-size:1rem;font-weight:600;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--sky);outline:none}
textarea{min-height:56px;resize:none}
label.f{display:grid;gap:2px;font-size:.82rem;color:var(--muted);font-weight:800;min-width:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .wide{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-weight:700;min-height:40px;font-size:.88rem}
.check input{width:20px;height:20px;accent-color:var(--sky-2)}
.refin{font-family:var(--display);font-size:1.4rem !important;font-weight:700 !important;letter-spacing:.04em;color:var(--blue-ink) !important}

/* ---------- animations ---------- */
@keyframes vInR{from{opacity:0;transform:translateX(42px)}to{opacity:1;transform:none}}
@keyframes vInL{from{opacity:0;transform:translateX(-42px)}to{opacity:1;transform:none}}
@keyframes vFade{from{opacity:0}to{opacity:1}}
@keyframes tileIn{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
@keyframes ckPop{0%{transform:scale(.4)}55%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes tilePop{0%{transform:scale(1)}35%{transform:scale(.93)}70%{transform:scale(1.03)}100%{transform:scale(1)}}
#main.vin-r > *{animation:vInR .28s cubic-bezier(.2,.8,.2,1) both}

#main.vin-f > *{animation:vFade .25s ease-out both}

.sheet.open.up{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open.fade{animation:vFade .22s ease-out}
.sheet-bg.open{animation:vFade .22s ease-out}
.sheet .bd.tabin{animation:vFade .2s ease-out}
.sq.inv.pop{animation:tilePop .3s ease-out}
.sq.inv.pop .ck{animation:ckPop .32s cubic-bezier(.2,.8,.2,1.4)}
.invbar .prog i{transition:width .5s cubic-bezier(.2,.8,.2,1)}
.sq.inv.leaving,.set.leaving{transition:transform .5s cubic-bezier(.5,0,.8,.4),opacity .5s;transform:translate(24px,60px) scale(.5) rotate(10deg);opacity:0}
.fx{position:absolute;pointer-events:none;z-index:200}
.flight{object-fit:contain;background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

/* ---------- scanner ---------- */
#scan{position:absolute;inset:0;z-index:150;background:#0b1a3a;display:flex;flex-direction:column;color:#fff}

#scan .last{font-weight:800}
#scan .row input{flex:1;min-width:0}
#scan .log{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
#scan .log div{display:flex;gap:6px;align-items:baseline}
.scanbtn{flex:0 0 auto;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--yellow);color:var(--blue-ink);box-shadow:0 4px 0 var(--yellow-deep)}
.scanbtn svg{width:26px;height:26px}

.searchbox input[type=search]{padding-right:54px}
/* Feuille de détail (reste dans le cadre du téléphone) */

.sheet.open{display:flex} .sheet-bg.open{display:block}
.sheet .hd{flex:none;background:var(--blue);color:#fff;padding:10px 14px 10px 8px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.banner{border-radius:14px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-weight:700;box-shadow:var(--edge);font-size:.84rem}

.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}

body.is-splash header.top, body.is-splash nav.tabs{display:none}
body.is-splash main{padding:0}
.splash{flex:1;min-height:0;padding:calc(18px + env(safe-area-inset-top)) 16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:6px;
  background:linear-gradient(180deg,#36b4f0 0%,#1e7fe0 40%,#2b44c8 100%);color:#fff;text-align:center}
.splash-title{font-family:var(--display);font-weight:700;font-size:2.2rem;letter-spacing:.06em;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.splash-sub{font-weight:800;opacity:.95}
.splash-art{width:100%;max-width:300px;height:auto;max-height:22vh;flex:0 1 auto;min-height:60px}
.splash-pin{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.splash-q{font-family:var(--display);font-weight:600;font-size:1.15rem}
.splash .pindots span{background:rgba(255,255,255,.25);box-shadow:none}
.splash .pindots span.on{background:var(--yellow);box-shadow:0 3px 0 var(--yellow-deep)}
.splash .keypad{grid-template-columns:repeat(3,68px);gap:9px}
.key{height:min(52px,6.4vh);min-height:40px;border-radius:16px;border:0;background:rgba(255,255,255,.18);color:#fff;font-family:var(--display);font-size:1.5rem;font-weight:600;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.welcome{display:grid;gap:12px}
.progress{height:8px;background:var(--card-2);border-radius:4px;overflow:hidden}
.progress > div{height:100%;background:var(--sky);width:0}
.ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;flex:none}
.stobig{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}

   Inspiration lego.com : fond clair, cartes produit, cartes de thème colorées
   ===================================================================== */
#app{background:#eef0f4}
.on-blue{color:var(--ink)} .on-blue h1,.on-blue h2{color:var(--blue-ink)}
.on-blue .empty,.empty.on-blue{color:var(--muted)}

.pc:active{transform:scale(.98)}
.pc .im{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:10px 10px 6px}

.tc{display:flex;flex-direction:column;background:#fff;border-radius:16px;padding:6px;box-shadow:0 1px 3px rgba(16,24,40,.1);text-decoration:none;color:var(--ink);min-width:0;transition:box-shadow .15s, transform .15s}

.avail.on{color:#18794e} .avail.off{color:#b45309}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

    if (looksB64(b.blob)) return b.blob;
    if (looksB64(b.data)) return b.data;
    if (b.type === 'text' && looksB64(b.text)) return b.text;
  }

}
function driveErr(e){
  const c = e && e.code;

  if (c === 'server_not_connected' || c === 'selection_required') return 'Le connecteur Google Drive n’est pas actif pour ce compte. Ajoute-le dans claude.ai → Paramètres → Connecteurs.';
  if (c === 'not_in_manifest' || c === 'approval_required' || c === 'consent_required') return 'L’app a besoin de ton autorisation pour accéder à Google Drive. Clique sur « Réessayer » et accepte la demande.';
  if (c === 'blocked_by_policy') return 'L’accès à Google Drive est bloqué par une règle de ton organisation.';
  if (c === 'server_unavailable' || c === 'upstream_error') return 'Google Drive ne répond pas pour l’instant. Réessaie dans un moment.';
  if (c === 'tool_error') return 'Google Drive a refusé l’opération : ' + (e.message || '').slice(0, 200);

}
async function findFolder(){

/* ---------- calculs ---------- */
function recalc(){
  if (!state.model) return;
  state.model.catalog = state.model.catalog || {}; state.model.wishlist = state.model.wishlist || [];
  state.calc = Calc.compute(state.model);
  let pieces = 0, figs = 0; state.calc.ownedRows.forEach(x => { const c = cat(x.s.ref); if (c) { pieces += num(c.pieces); figs += num(c.minifigs); } });
  state.calc.totals.pieces = pieces; state.calc.totals.minifigs = figs;
}
const distinct = key => Array.from(new Set((state.model ? state.model.sets : []).map(s => s[key]).filter(Boolean))).sort((a,b) => a.localeCompare(b, 'fr'));
function ownedOf(ref){ return state.calc.rows.filter(x => x.s.ref === String(ref)); }
function wishOf(ref){ return (state.model.wishlist || []).find(w => w.ref === String(ref)); }

/* ---------- liens internes ---------- */
// Toute navigation passe par l'adresse (#vue/sous-vue?filtres) : chaque élément cliquable est un lien, le bouton « retour » fonctionne.

const lk = (href, text, extra) => `<a class="lnk" href="${esc(href)}"${extra || ''}>${text}</a>`;
const themeLink = t => t ? lk(colH({ serie: t }), esc(t)) : '';
function stoHref(name){ const o = storageByName(name); return o ? H('stockage/' + o.id) : colH({ position: '__none' }); }
function statutChipL(ref){ const st = statut(ref); return st === 'Retiré' ? `<a class="chip retired" href="${esc(colH({ statut: 'Retiré' }))}">Retiré</a>` : st === 'En vente' ? `<a class="chip blue" href="${esc(colH({ statut: 'En vente' }))}">En vente</a>` : ''; }

const STO_ICON = { 'Boîte':'📦', 'Bac':'🗃️', 'Étagère':'🗄️', 'Vitrine':'🪟', 'Meuble':'🚪', 'Exposition':'🏛️', 'Au sol':'⬇️', 'Autre':'📍' };

const STO_IMG = { 'Boîte': 'sto/boite-gris.webp', 'Étagère': 'sto/etagere.webp' };
function stoIcon(type){ return STO_IMG[type] ? `<img src="${STO_IMG[type]}" alt="${esc(type)}" class="stoimg">` : (STO_ICON[type] || '📦'); }
function guessType(n){ const f = fold(n); return /^box|boite|refbox|selfbox/.test(f) ? 'Boîte' : /bac/.test(f) ? 'Bac' : /etagere/.test(f) ? 'Étagère' : /vitrine/.test(f) ? 'Vitrine' : /expos/.test(f) ? 'Exposition' : /^sol/.test(f) ? 'Au sol' : 'Autre'; }

function storages(){

/* ---------- pagination (pas de défilement) ---------- */
// Chaque liste remplit la place disponible : on mesure la zone, on en déduit le nombre de lignes par page.
function pageOf(key, arr, rowH){
  const ps = Math.max(1, state.ps[key] || 6);
  const pages = Math.max(1, Math.ceil(arr.length / ps));
  const p = Math.min(Math.max(0, state.pg[key] || 0), pages - 1); state.pg[key] = p;
  return { items: arr.slice(p * ps, (p + 1) * ps), p, pages, key, rowH };
}

}

  const series = setsIn(o.name).map(x => x.s).filter(s => isCMF(s.ref));
  let target = null; const known = dmInfo(code);
  if (known) target = series.find(s => fold(s.ref) === fold(known.ref) && inv.present.includes(s.id)) || series.find(s => fold(s.ref) === fold(known.ref));
  if (!target && inv.lastSeries) target = series.find(s => s.id === inv.lastSeries);
  if (!target && series.length === 1) target = series[0];
  if (!target) {
    beep(false);
    if (!series.length) { scanMsg(`<div class="last">Code de figurine ${esc(code)}</div><div class="small muted b">Aucune série de minifigurines attendue dans ${esc(o.name)}.</div>`); return; }
    scanMsg(`<div class="last">Figurine ${esc(code)} : quelle série ?</div><div class="small muted b">Scanne d’abord le code-barres d’une boîte de la série, ou choisis :</div>` + series.map(s => `<button class="btn sm" data-act="scan-series" data-id="${esc(s.id)}" data-code="${esc(code)}">${esc(s.ref)} ${esc(s.name || '')}</button>`).join(''));
    return;
  }
  invFigAdd(target, code, !known);
}
function invFigAdd(s, code, learn){
  const inv = state.inv; inv.figs = inv.figs || {};
  const prev = String(s.figCodes || '').split(/[\s,;]+/).filter(Boolean);
  const list = inv.figs[s.id] || (inv.figs[s.id] = []);
  if (!inv.present.includes(s.id)) inv.present.push(s.id);
  inv.lastSeries = s.id;
  if (learn) commitQuiet(m => { m.codes = m.codes || []; if (!m.codes.some(c => c.type === 'DM' && c.code === code)) m.codes.push({ code, type: 'DM', ref: s.ref, fig: '', src: 'inventaire' }); });
  const dup = list.includes(code);
  if (!dup) list.push(code);
  saveInv(); beep(!dup);
  const n = list.length, N = 12;
  scanMsg(`<div class="last">${dup ? '↺ Déjà scannée' : '✅ Figurine'} · ${esc(s.ref)} ${esc(s.name || '')}</div><div class="small muted b">${n} / ${N} figurines distinctes${prev.length && !dup ? ` · ${prev.filter(c => !list.includes(c)).length} vues lors d’un inventaire précédent et pas encore rescannées` : ''}</div>`);
  scanLog(dup ? '↺' : '🧍', `${esc(s.ref)} · ${n}/${N}`);
}

      scanMsg(`<div class="last">${xs.length ? '✅' : '❌'} ${esc(ref)} ${esc(nm)}</div><div class="small muted b">${xs.length ? `${xs.length} exemplaire${xs.length > 1 ? 's' : ''} · ${xs.map(x => esc(x.s.position || 'à ranger')).join(', ')}` : 'Pas dans ta collection.'}${w ? ' · ★ dans tes envies' : ''}</div>
        <div class="row">${xs.length ? `<button class="btn sm" data-act="scan-open" data-id="${esc(xs[0].s.id)}">Ouvrir la fiche</button>` : `<button class="btn sm" data-act="scan-go-add" data-ref="${esc(ref)}" data-dest="collection">＋ Ajouter</button><button class="btn sm" data-act="scan-go-add" data-ref="${esc(ref)}" data-dest="envies">★ Envie</button>`}</div>`);
      scanLog(xs.length ? '✅' : '❌', esc(ref + ' ' + nm));

function searchAll(q){
  q = fold(q); if (!q) return [];
  const isNum = /^\d+(-\d+)?$/.test(q); const qn = q.replace(/-\d+$/, '');
  const refs = new Map();
  const add = (ref, name, prio) => { const r = refs.get(ref); if (!r || r.prio > prio) refs.set(ref, { ref, name, prio }); };
  state.model.sets.forEach(s => { if ((isNum && s.ref.startsWith(qn)) || (!isNum && (fold(s.name).includes(q) || fold(s.serie).includes(q)))) add(s.ref, s.name, s.ref === qn ? 0 : 1); });
  state.model.wishlist.forEach(w => { if ((isNum && w.ref.startsWith(qn)) || (!isNum && fold(w.name).includes(q))) add(w.ref, w.name, w.ref === qn ? 0 : 2); });
  if (isNum) {
    Object.entries(state.model.catalog).forEach(([k, c]) => { if (k.startsWith(qn)) add(k, c.name, k === qn ? 0 : 3); });
    if (CATALOG && CATALOG[qn]) add(qn, CATALOG[qn][0], 0);
  } else if (CATALOG && q.length >= 3) {
    let n = 0; for (const k in CATALOG) { if (fold(CATALOG[k][0]).includes(q)) { add(k, CATALOG[k][0], 4); if (++n > 40) break; } }
  }
  return [...refs.values()].sort((a, b) => a.prio - b.prio || a.ref.localeCompare(b.ref, 'fr', { numeric: true }));
}

/* ---------- graphique budget ---------- */
function lineChart(tl){
  if (!tl.length) return '<div class="empty">Pas encore de données.</div>';
  const W = 640, H = 330, L = 54, R = 12, T = 12, B = 28;
  const max = Math.max(...tl.map(p => Math.max(p.spent, p.allowed))) * 1.05;
  const step = Math.pow(10, Math.floor(Math.log10(max))) / 2;
  const tick = Math.ceil(max / 5 / step) * step;
  const x = i => L + i * (W - L - R) / Math.max(1, tl.length - 1);
  const y = v => T + (H - T - B) * (1 - v / (tick * 5));
  const path = k => tl.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[k]).toFixed(1)).join(' ');
  let grid = '';
  for (let i = 0; i <= 5; i++) { const v = tick * i; grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e4ebf5" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="12" font-weight="700" fill="#5a6b85">${v >= 1000 ? (v / 1000).toLocaleString('fr-BE') + ' k' : v}</text>`; }
  tl.forEach((p, i) => { if (p.month.endsWith('-01') || i === 0) grid += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="12" font-weight="700" fill="#5a6b85">${p.month.slice(0, 4)}</text>`; });
  const li = tl.length - 1, lp = tl[li];
  return `<div class="legend"><span><i style="background:var(--s-valeur)"></i>Dépensé cumulé</span><span><i style="background:var(--s-budget)"></i>Budget autorisé cumulé</span></div>
  <div class="chart fill" id="chart" data-points='${esc(JSON.stringify(tl))}'>
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Dépenses cumulées comparées au budget autorisé">${grid}
    <path d="${path('spent')} L ${x(li)} ${y(0)} L ${x(0)} ${y(0)} Z" fill="var(--s-valeur)" opacity=".08"/>
    <path d="${path('allowed')}" fill="none" stroke="var(--s-budget)" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
    <path d="${path('spent')}" fill="none" stroke="var(--s-valeur)" stroke-width="2.4" vector-effect="non-scaling-stroke"/>
    <line id="cx" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#5a6b85" stroke-width="1" opacity="0" vector-effect="non-scaling-stroke"/>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/>
  </svg><div class="tip" id="tip"></div></div>`;
}
function bindChart(){
  const ch = document.getElementById('chart'); if (!ch) return;
  const tl = JSON.parse(ch.dataset.points); const svg = ch.querySelector('svg'); const tip = ch.querySelector('#tip'); const cx = ch.querySelector('#cx');
  const W = 640, L = 54, R = 12; const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  function move(ev){
    const r = svg.getBoundingClientRect(); const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * W;
    const i = Math.max(0, Math.min(tl.length - 1, Math.round((px - L) / ((W - L - R) / Math.max(1, tl.length - 1)))));

    tip.style.display = 'block'; tip.style.left = Math.min(r.width - 170, Math.max(0, xx / W * r.width + 12)) + 'px'; tip.style.top = '10px';
  }
  const hit = ch.querySelector('#hit');
  hit.addEventListener('mousemove', move); hit.addEventListener('touchmove', move, { passive: true }); hit.addEventListener('touchstart', move, { passive: true });

}

function figPrice(id){
  const f = (state.model.figPrices || {})[id];
  if (f && num(f.value) > 0) return { value: num(f.value), source: f.source || 'Saisie', date: f.date, manual: true };
  const v = FIGVAL && FIGVAL.v[id];
  if (v && (num(v[0]) > 0 || num(v[1]) > 0)) return { value: num(v[0]) || num(v[1]), source: num(v[0]) ? 'Brickset (neuf)' : 'Brickset (occasion)', date: FIGVAL.date, used: num(v[1]) || null };

}

function histLines(s){ return String(s.hist || '').split('\n').map(x => x.trim()).filter(Boolean); }

/* Figurines : liste par set (figs/index.json) et images regroupées en quelques fichiers (figs/img-N.json). */
const FIG_CHUNKS = 8;
let FIGS = null, FIGVAL = null, FIGEXTRA = null, figsLoading = null; const FIGIMG = {}, figChunkLoading = {};
function loadFigs(){ if (FIGS || figsLoading) return figsLoading; fetch('figs/values.json').then(r => r.ok ? r.json() : null).then(j => { FIGVAL = j; if (state.sheetSet) refreshSheet(); else if (['figurines', 'rentabilite'].includes(state.view)) render(); }).catch(() => {});
  fetch('figs/extra.json').then(r => r.ok ? r.json() : null).then(j => { if (j && j.ids) { FIGEXTRA = new Set(j.ids); if (state.sheetSet) refreshSheet(); else if (state.view === 'figurines') render(); } }).catch(() => {});
  figsLoading = fetch('figs/index.json').then(r => r.ok ? r.json() : {}).then(j => { FIGS = j || {}; if (state.sheetSet) refreshSheet(); if (state.view === 'figurines') render(); }).catch(() => { FIGS = {}; }); return figsLoading; }
function figsOf(ref){ if (!FIGS) { loadFigs(); return null; } return FIGS[ref] || null; }
function figChunk(id){ let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % FIG_CHUNKS; }
function figImg(id, size){
  if (FIGEXTRA && FIGEXTRA.has(id)) return `<span class="thumb ${size || ''}"><img src="figs/m/${encodeURIComponent(id)}.webp" alt="" loading="lazy"></span>`;

async function pinKey(k){
  if (state.pin.length >= 4) return;
  state.pin += k; state.pinMsg = ''; render();
  if (state.pin.length < 4) return;
  const entry = state.pin; state.pin = '';
  const P = state.model.params;
  if (P.pinHash) {
    if (await sha(entry) === P.pinHash) unlockNow(); else { state.pinMsg = 'Code incorrect'; render(); }
  } else if (!state.pinFirst) { state.pinFirst = entry; render(); }
  else if (state.pinFirst === entry) { const h = await sha(entry); state.pinFirst = ''; commit('Code enregistré', m => { m.params = Object.assign({}, m.params, { pinHash: h }); }); unlockNow(); }
  else { state.pinFirst = ''; state.pinMsg = 'Les deux codes sont différents, recommence'; render(); }
}
function unlockNow(){
  state.unlockUntil = Date.now() + LOCK_MS; state.pinMsg = '';
  if (state.splash) { state.splash = false; if (!location.hash || location.hash === '#') location.hash = 'accueil'; }
  const after = state.afterUnlock; state.afterUnlock = null;
  render(); if (after) { location.hash = after.hash; setTimeout(() => after.id && openSheet(after.id, 'valeur'), 80); }
}

async function askJSON(prompt){
  if (typeof sample.json === 'function') { try { return await sample.json(prompt, { modelTier: 'default' }); } catch (e) { if (e && ['not_granted','rate_limited'].includes(e.code)) throw e; } }
  const r = await sample(prompt, { modelTier: 'default' });
  const m = String(r.text || '').match(/[\[{][\s\S]*[\]}]/);
  if (!m) throw { message: 'Réponse illisible' };
  return JSON.parse(m[0]);
}
function aiErr(e){ return e && e.code === 'not_granted' ? 'Claude n’est pas autorisé pour cette app.' : e && e.code === 'rate_limited' ? 'Trop de demandes : réessaie dans une minute.' : 'Claude n’a pas pu répondre.'; }
const PRICE_PROMPT = sets => `Tu es expert du marché secondaire LEGO en Europe (BrickLink, eBay, Vinted).
Pour chaque set ci-dessous, estime le prix de revente actuel en euros d'un exemplaire NEUF SCELLÉ sur le marché européen. Si tu ne connais pas le set, mets null.
Réponds UNIQUEMENT avec un tableau JSON : [{"ref":"10294","valeur":650,"confiance":"haute|moyenne|faible"}]
Sets :
${sets.map(s => `- ${s.ref} : ${s.name}${s.prixConseille ? ` (prix conseillé ${s.prixConseille} €)` : ''}`).join('\n')}`;
async function aiBatch(){
  const refs = {}; state.calc.ownedRows.forEach(x => { if (!state.model.prices[x.s.ref] && !refs[x.s.ref]) refs[x.s.ref] = x.s; });
  const list = Object.values(refs); if (!list.length) return;
  state.estimating = { done: 0, total: list.length, stop: false }; render();
  const found = {};
  for (let i = 0; i < list.length && !state.estimating.stop; i += 20) {
    try { const res = await askJSON(PRICE_PROMPT(list.slice(i, i + 20))); (Array.isArray(res) ? res : []).forEach(it => { if (it && it.ref != null && num(it.valeur) > 0 && refs[String(it.ref)]) found[String(it.ref)] = { v: num(it.valeur), c: it.confiance || '' }; }); }
    catch (e) { toast(aiErr(e)); if (e && ['not_granted','rate_limited'].includes(e.code)) break; }
    state.estimating.done = Math.min(list.length, i + 20); if (state.view === 'rentabilite') render();
  }
  state.estimating = null;
  const n = Object.keys(found).length; if (!n) { render(); toast('Aucune estimation obtenue.'); return; }
  const d = today();
  commit(n + ' prix estimés par Claude enregistrés', m => { Object.entries(found).forEach(([ref, o]) => { if (!m.prices[ref]) m.prices[ref] = { value: o.v, date: d, source: 'Estimation Claude' + (o.c ? ' (' + o.c + ')' : ''), history: [{ d, v: o.v, s: 'Estimation Claude' }] }; }); });
}
/* ---------- Brickfact (valeur de marché des sets scellés, en €) ---------- */
const BRICKFACT = 'Brickfact';
function bfPayload(res){
  let p = payloadOf(res);
  if (p && Array.isArray(p.content)) { const t = p.content.find(c => c && c.type === 'text'); if (t) p = t.text; }
  if (p && p.structuredContent) p = p.structuredContent;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch(e) { p = null; } }
  return p;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function brickfactRefresh(){
  if (!mcp || state.bfRun) return;
  const refs = [...new Set(state.calc.ownedRows.map(x => String(x.s.ref)).concat(state.model.wishlist.map(w => String(w.ref))))].filter(r => /^\d+$/.test(r));
  state.bfRun = { done: 0, total: refs.length, ok: 0, stop: false }; render();
  const found = {}; let fatal = '';
  for (const ref of refs) {
    if (state.bfRun.stop) break;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const p = bfPayload(await mcp.callTool(BRICKFACT, 'get_price_history', { market: 'FR', set_id: +ref, range: '1Y', language: 'fr' }, { cache: false }));
        const pts = (p && Array.isArray(p.points) ? p.points : []).filter(x => num(x.value) > 0);
        if (pts.length) { const last = pts[pts.length - 1]; found[ref] = { bf: num(last.value), bfDate: last.date, bfMin: num(p.min) || null, bfMax: num(p.max) || null }; state.bfRun.ok++; }
        break;
      } catch (e) {
        const c = e && e.code;
        if (c === 'not_granted' || c === 'server_not_connected' || c === 'policy_denied') { fatal = c === 'server_not_connected' ? 'Connecteur Brickfact non connecté dans claude.ai.' : 'Accès à Brickfact refusé.'; break; }
        if (e && (e.retryable || c === 'rate_limited')) { await sleep(15000 * (attempt + 1)); continue; }
        break; // set inconnu chez Brickfact : on passe
      }
    }
    if (fatal) break;
    state.bfRun.done++; if (state.view === 'rentabilite' && state.bfRun.done % 5 === 0) render();
    await sleep(350);
  }
  state.bfRun = null;
  if (fatal) toast(fatal);
  const n = Object.keys(found).length; if (!n) { render(); if (!fatal) toast('Aucune valeur Brickfact obtenue.'); return; }
  commit(n + ' valeurs Brickfact enregistrées', m => { Object.entries(found).forEach(([ref, o]) => { m.prices[ref] = Object.assign({ value: 0, date: '', source: '', history: [] }, m.prices[ref] || {}, o); }); });
}

(function gestures(){
  const app = $('#app'); let x0 = null, y0 = 0, tgt = null;
  app.addEventListener('touchstart', e => { if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; tgt = e.target; } }, { passive: true });
  app.addEventListener('touchend', e => { if (x0 == null) return; const t = e.changedTouches[0]; const dx = t.clientX - x0, dy = t.clientY - y0; x0 = null; if (Math.abs(dx) > 60 && Math.abs(dy) < 60) swipe(dx < 0 ? 1 : -1, tgt); }, { passive: true });
  let wheelAt = 0;
  app.addEventListener('wheel', e => {
    const f = e.target.closest('[data-fit]'); if (!f) return;
    const pager = (f.closest('.sheet') || $('#main')).querySelector(`[data-pager="${f.dataset.fit}"]`); if (!pager) return;
    e.preventDefault(); const now = Date.now(); if (now - wheelAt < 350 || Math.abs(e.deltaY) < 8) return; wheelAt = now;
    const d = e.deltaY > 0 ? 1 : -1; const btn = pager.querySelector(`[data-d="${d}"]`); if (btn && !btn.disabled) turn(f.dataset.fit, d);
  }, { passive: false });
  let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(fitLists, 150); });
})();

/* Adresse → vue : #vue[/sous-vue][?filtres] */
function route(){
  const raw = (location.hash || '#accueil').slice(1);
  const [path, query] = raw.split('?');
  const parts = path.split('/'); const v = parts[0];
  const prevView = state.view;
  state.view = ['accueil','collection','figurines','ajouter','envies','stockage','rentabilite','reglages'].includes(v) ? v : 'accueil';
  state.sub = ['accueil','rentabilite','reglages'].includes(state.view) ? (parts[1] || '') : '';
  state.arg = state.view === 'stockage' ? decodeURIComponent(parts[1] || '') : '';
  // Changer d'onglet efface les recherches en cours (accueil, collection, figurines, inventaire).
  if (prevView !== state.view && !state.splash) {
    state.q = ''; state.figQ = ''; state.pg['home-res'] = 0;
    if (state.inv) { state.inv.q = ''; saveInv(); }
    if (state.view === 'collection' && query == null) { state.filters = emptyFilters(state.filters.sort); state.scroll.col = 0; }
    else if (prevView === 'collection') state.filters = emptyFilters(state.filters.sort);
  }
  if (state.view === 'collection' && query != null) {
    const qp = new URLSearchParams(query); const f = emptyFilters(qp.get('sort') || 'date');
    FKEYS.forEach(k => { if (qp.get(k)) f[k] = qp.get(k); });
    state.filters = f; state.pg.col = 0; state.scroll.col = 0;
  }
  if (state.view === 'accueil' && state.q && !parts[1]) { /* garde la recherche en cours */ }
  if (state.view !== 'ajouter') state.addPrefill = null;
  closeSheet('nav'); render();
}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (document.hidden) state.hiddenAt = Date.now(); else if (state.hiddenAt && Date.now() - state.hiddenAt > 60000 && unlocked()) { state.unlockUntil = 0; if (state.sheetSet) refreshSheet(); render(); } });

/* ---------- démarrage ---------- */
(function boot(){
  const c = loadCache();
  if (c && c.model) { state.model = c.model; state.fileMeta = c.fileMeta; state.fileId = c.fileMeta && c.fileMeta.id; state.folderId = c.folderId; recalc(); }
  route(); setTimeout(loadFigs, 400); setTimeout(loadCodes, 600);
  let tries = 0;
  (function wait(){
    if (window.claude && typeof window.claude.use === 'function') return start();
    if (++tries > 30) { state.conn = 'nomcp'; setSync('err', 'Hors de claude.ai'); render(); return; }
    setTimeout(wait, 100);
  })();
})();
function start(){
  claude.use('sample').then(s => { sample = s; if (['ajouter','rentabilite'].includes(state.view)) render(); }).catch(() => {});
  claude.use('mcp').then(m => {
    if (!m) { state.conn = 'nomcp'; setSync('err', 'Google Drive indisponible'); render(); return; }
    mcp = m; syncFromDrive();
  }).catch(() => { state.conn = 'nomcp'; setSync('err', 'Google Drive indisponible'); render(); });
}
})();
</script>
